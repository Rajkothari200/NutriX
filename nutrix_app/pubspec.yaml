name: nutrix_app
description: "NutriX AI Diet Planner Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Routing
  go_router: ^14.8.1

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Barcode scanner
  # Image picker (for OCR)
  image_picker: ^1.1.2

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  percent_indicator: ^4.2.3
  permission_handler: ^12.0.3
  simple_barcode_scanner: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
